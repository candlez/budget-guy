name: Main CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment:
      name: development

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::182872618525:role/budget-guy-github-cicd-oidc-role
          role-session-name: budget-guy-pipeline-${{ github.run_id }}
          aws-region: us-east-1

      - name: Get short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Update task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: budget-guy
          container-name: budget-guy-spring
          image: thomasmcnamara7/budget-guy:${{ env.SHORT_SHA }}

      - name: Update ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: budget-guy-dev-service-0xfrdc5z
          cluster: budget-guy

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::182872618525:role/budget-guy-github-cicd-oidc-role
          role-session-name: budget-guy-pipeline-${{ github.run_id }}
          aws-region: us-east-1

      - name: Get short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Update task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: budget-guy
          container-name: budget-guy-spring
          image: thomasmcnamara7/budget-guy:${{ env.SHORT_SHA }}

      - name: Update ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: budget-guy-service-poid3dxs
          cluster: budget-guy
