<div id="categories-page-wrapper">
  @if (categories().length !== 0) {
    <div id="button-bar-holder">
      <a routerLink="/categories/create" id="new-button-anchor"><button matButton="filled" id="new-button">New</button></a>
    </div>

    <table mat-table [dataSource]="categories()" id="categories-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let category">{{category.name}}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let category">{{category.description}}</td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Date Created</th>
        <td mat-cell *matCellDef="let category">{{category.createdAt.toLocaleString('en-US', {
          dateStyle: 'short',
          timeStyle: 'short'
        })}}</td>
      </ng-container>

      <ng-container matColumnDef="optionsButton">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let category">
          <button matIconButton (click)="openDialog(category)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  } @else {
    <mat-spinner color="primary" id="categories-spinner"></mat-spinner>
  }
</div>
